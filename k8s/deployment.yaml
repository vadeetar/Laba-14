apiVersion: apps/v1
kind: Deployment
metadata:
  name: sports-collector
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sports-collector
  template:
    metadata:
      labels:
        app: sports-collector
    spec:
      containers:
        - name: collector
          image: lab14-sports-collector:latest
          env:
            - name: NATS_URL
              value: nats://nats:4222
            - name: ETCD_ENDPOINTS
              value: etcd:2379
            - name: OUTPUT_DIR
              value: /data
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sports-collector-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sports-collector
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
